<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/stilo/style.css">
    <title>Que nota</title>
</head>

<body>
    <div id="navar">
        <img src="/imagen/logo.png" width="85" height="85">
        <button class="hamburgesa"><img src="/iconos/menu.png" width="45" height="50"></button>
    </div>
    <span>
        .
    </span>
    <div id="buscar">
        <input type="text" placeholder="Buscar..">
        <button>Buscar</button>
    </div>

    <div class="Seccion-m">
        <div class="carrusel">
            <!-- Flecha izquierda -->
            <button class="carrusel-I" id="prev-btn">
                <img src="/iconos/Izquierda.png" height="20" width="15">
            </button>

            <div class="album-container">
                <!-- Contenedor con las 4 imágenes -->
                <div class="carrusel-container" id="carrusel-slider">
                    <!-- Imagen 1 -->
                    <div class="album-card">
                        <div class="image-wrapper">
                            <img src="/imagen/Nirvana.jpg" width="100" height="100">
                        </div>
                        <p class="album-title">Album 1</p>
                    </div>

                    <!-- Imagen 2 -->
                    <div class="album-card">
                        <div class="image-wrapper">
                            <img src="/imagen/algo.jpg" width="100" height="100">
                        </div>
                        <p class="album-title">Album 2</p>
                    </div>

                    <!-- Imagen 3 -->
                    <div class="album-card">
                        <div class="image-wrapper">
                            <img src="/imagen/gorillaz.jpg" width="100" height="100">
                        </div>
                        <p class="album-title">Album 3</p>
                    </div>

                    <!-- Imagen 4 -->
                    <div class="album-card">
                        <div class="image-wrapper">
                            <img src="/imagen/michael.jpg" width="100" height="100">
                        </div>
                        <p class="album-title">Album 4</p>
                    </div>
                </div>
            </div>

            <!-- Flecha derecha -->
            <button class="carrusel-D" id="next-btn">
                <img src="/iconos/Derecha.png" height="20" width="15">

            </button>
        </div>
        <div class="imagen-A">
            <img src="/imagen/gorillaz.jpg">
        </div>
    </div>
    <div class="barra">
        <img src="/imagen/song-progres.png" alt="">
    </div>
    </nav>
</body>
<footer class="barra-reproductor">
    <div class="info-pista">
        <div class="mini-portada"></div>
        <div class="detalles-pista">
            <span class="titulo-pista">Canción Actual</span>
            <span class="artista-pista">Artista</span>
        </div>
    </div>

    <div class="contenedor-controles">
        <div class="controles-reproduccion">
            <button class="icono-control solo-escritorio" aria-label="Modo aleatorio">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M10.59,9.17L5.41,4L4,5.41l5.17,5.17L10.59,9.17z M14.5,4l2.04,2.04L4,18.59L5.41,20L17.96,7.46L20,9.5V4H14.5z M14.83,13.41 l-1.41,1.41l3.13,3.13L14.5,20H20v-5.5l-2.04,2.04L14.83,13.41z" />
                </svg>
            </button>
            <button class="icono-control" aria-label="Canción anterior">
                <svg viewBox="0 0 24 24">
                    <path d="M6,6h2v12H6V6z M9.5,12L18,18V6L9.5,12z" />
                </svg>
            </button><button class="boton-reproducir-principal" aria-label="Reproducir o pausar">
                <svg viewBox="0 0 24 24">
                    <path d="M8,5v14l11-7L8,5z" />
                </svg>
            </button>
            <button class="icono-control" aria-label="Siguiente canción">
                <svg viewBox="0 0 24 24">
                    <path d="M6,18l8.5-6L6,6V18z M16,6v12h2V6H16z" />
                </svg>
            </button>
            <button class="icono-control solo-escritorio" aria-label="Repetir">
                <svg viewBox="0 0 24 24">
                    <path d="M7,7h10v3l4-4l-4-4v3H5v6h2V7z M17,17H7v-3l-4,4l4,4v-3h12v-6h-2V17z" />
                </svg>
            </button>
        </div>
        <div class="contenedor-progreso">
            <span class="marca-tiempo">1:24</span>
            <div class="fondo-barra-progreso">
                <div class="relleno-barra-progreso"></div>
            </div>
            <span class="marca-tiempo">3:40</span>
        </div>
    </div>

    <div class="controles-adicionales solo-escritorio"><button class="icono-control" aria-label="Cola de reproducción">
            <svg viewBox="0 0 24 24">
                <path
                    d="M10,4H4C2.9,4,2.01,4.9,2.01,6L2,18c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8c0-1.1-0.9-2-2-2h-8L10,4z" />
            </svg>
        </button>
        <button class="icono-control" aria-label="Control de volumen">
            <svg viewBox="0 0 24 24">
                <path
                    d="M3,9v6h4l5,5V4L7,9H3z M16.5,12c0-1.77-1.02-3.29-2.5-4.03v8.05C15.48,15.29,16.5,13.77,16.5,12z M14,3.23v2.06c2.89,0.86,5,3.54,5,6.71 s-2.11,5.85-5,6.71v2.06c4.01-0.91,7-4.49,7-8.77S18.01,4.14,14,3.23z" />
            </svg>
        </button>
        <div class="barra-volumen"></div>
    </div>

</footer>

</html>
